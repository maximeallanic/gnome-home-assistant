# Controls for the computer "My Computer" (Home Assistant for GNOME).
# Generated by the extension preferences from the entity ids Home Assistant gave this computer.
# Save it as packages/gnome_computer.yaml in the Home Assistant configuration folder, then restart Home Assistant.
template:
  - binary_sensor:
      - name: "My Computer online"
        unique_id: my_computer_online
        default_entity_id: binary_sensor.my_computer_online
        device_class: connectivity
        state: >
          {% set t = states('sensor.my_computer_last_contact') | as_datetime(none) %}
          {{ t is not none and now() - t < timedelta(minutes=3) }}
  - number:
      - name: "My Computer volume"
        unique_id: my_computer_volume_control
        default_entity_id: number.my_computer_volume
        icon: mdi:volume-high
        unit_of_measurement: "%"
        min: 0
        max: 100
        step: 5
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ states('sensor.my_computer_volume') | int(0) }}"
        set_value:
          - action: notify.mobile_app_my_computer
            data:
              message: command_volume
              data:
                level: "{{ value }}"
      - name: "My Computer brightness"
        unique_id: my_computer_brightness_control
        default_entity_id: number.my_computer_brightness
        icon: mdi:brightness-6
        unit_of_measurement: "%"
        min: 0
        max: 100
        step: 5
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ states('sensor.my_computer_brightness') | int(0) }}"
        set_value:
          - action: notify.mobile_app_my_computer
            data:
              message: command_brightness
              data:
                level: "{{ value }}"
      - name: "My Computer keyboard backlight"
        unique_id: my_computer_keyboard_backlight_control
        default_entity_id: number.my_computer_keyboard_backlight
        icon: mdi:keyboard-outline
        unit_of_measurement: "%"
        min: 0
        max: 100
        step: 5
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ states('sensor.my_computer_keyboard_backlight') | int(0) }}"
        set_value:
          - action: notify.mobile_app_my_computer
            data:
              message: command_keyboard_backlight
              data:
                level: "{{ value }}"
  - switch:
      - name: "My Computer mute"
        unique_id: my_computer_muted_control
        default_entity_id: switch.my_computer_mute
        icon: mdi:volume-off
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ is_state('binary_sensor.my_computer_muted', 'on') }}"
        turn_on:
          - action: notify.mobile_app_my_computer
            data:
              message: command_mute
              data:
                state: "on"
        turn_off:
          - action: notify.mobile_app_my_computer
            data:
              message: command_mute
              data:
                state: "off"
      - name: "My Computer do not disturb"
        unique_id: my_computer_do_not_disturb_control
        default_entity_id: switch.my_computer_do_not_disturb
        icon: mdi:bell-off
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ is_state('binary_sensor.my_computer_do_not_disturb', 'on') }}"
        turn_on:
          - action: notify.mobile_app_my_computer
            data:
              message: command_do_not_disturb
              data:
                state: "on"
        turn_off:
          - action: notify.mobile_app_my_computer
            data:
              message: command_do_not_disturb
              data:
                state: "off"
      - name: "My Computer caffeine"
        unique_id: my_computer_caffeine_control
        default_entity_id: switch.my_computer_caffeine
        icon: mdi:coffee
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ is_state('binary_sensor.my_computer_caffeine', 'on') }}"
        turn_on:
          - action: notify.mobile_app_my_computer
            data:
              message: command_caffeine
              data:
                state: "on"
        turn_off:
          - action: notify.mobile_app_my_computer
            data:
              message: command_caffeine
              data:
                state: "off"
      - name: "My Computer screen"
        unique_id: my_computer_screen_on_control
        default_entity_id: switch.my_computer_screen
        icon: mdi:monitor
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ is_state('binary_sensor.my_computer_screen_on', 'on') }}"
        turn_on:
          - action: notify.mobile_app_my_computer
            data:
              message: command_screen
              data:
                state: "on"
        turn_off:
          - action: notify.mobile_app_my_computer
            data:
              message: command_screen
              data:
                state: "off"
      - name: "My Computer dark style"
        unique_id: my_computer_dark_theme_control
        default_entity_id: switch.my_computer_dark_theme
        icon: mdi:theme-light-dark
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        state: "{{ is_state('sensor.my_computer_theme', 'dark') }}"
        turn_on:
          - action: notify.mobile_app_my_computer
            data:
              message: command_theme
              data:
                theme: dark
        turn_off:
          - action: notify.mobile_app_my_computer
            data:
              message: command_theme
              data:
                theme: light
  - button:
      - name: "My Computer lock"
        unique_id: my_computer_lock
        default_entity_id: button.my_computer_lock
        icon: mdi:lock
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        press:
          - action: notify.mobile_app_my_computer
            data:
              message: command_lock
      - name: "My Computer play or pause"
        unique_id: my_computer_play_pause
        default_entity_id: button.my_computer_play_pause
        icon: mdi:play-pause
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        press:
          - action: notify.mobile_app_my_computer
            data:
              message: command_media
              data:
                action: play_pause
      - name: "My Computer next track"
        unique_id: my_computer_next
        default_entity_id: button.my_computer_next
        icon: mdi:skip-next
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        press:
          - action: notify.mobile_app_my_computer
            data:
              message: command_media
              data:
                action: next
      - name: "My Computer previous track"
        unique_id: my_computer_previous
        default_entity_id: button.my_computer_previous
        icon: mdi:skip-previous
        availability: "{{ is_state('binary_sensor.my_computer_online', 'on') }}"
        press:
          - action: notify.mobile_app_my_computer
            data:
              message: command_media
              data:
                action: previous

script:
  my_computer_open_url:
    alias: "My Computer: open a web address"
    mode: queued
    fields:
      url:
        description: "http or https address to open in the default browser"
        required: true
        example: https://www.home-assistant.io
        selector:
          text:
    sequence:
      - action: notify.mobile_app_my_computer
        data:
          message: command_open_url
          data:
            url: "{{ url }}"
  my_computer_launch_app:
    alias: "My Computer: launch an application"
    mode: queued
    fields:
      app:
        description: "Desktop file ID of the application"
        required: true
        example: org.gnome.Nautilus.desktop
        selector:
          text:
    sequence:
      - action: notify.mobile_app_my_computer
        data:
          message: command_launch_app
          data:
            app: "{{ app }}"
