  <image x="357" y="72" width="326" height="64" xlink:href="../../screenshots/dark-topbar.png"/>
  <image x="60" y="204" width="440" height="708" xlink:href="../../screenshots/dark-grid-detail.png"/>
  <image x="540" y="204" width="440" height="691" xlink:href="../../screenshots/dark-grid-tasks.png"/>
